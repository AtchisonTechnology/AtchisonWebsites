[dev]
  command = "bin/bridgetown dev"
  targetPort = 4000
  port = 8888
  publish = "output"
  autoLaunch = true
  framework = "#custom"

[context.dev.build.environment]
  NODE_ENV = "development"
  BRIDGETOWN_ENV = "development"

[build]
  command = "bin/bridgetown deploy"
  publish = "output"
  # Unlike LeeAtchison and AtchisonAcademy, this site does not read shared/ —
  # it is deliberately standalone (Spec0024 Open Question 12; same reasoning
  # as AtchisonAcademyCourses/Spec0021). Netlify's default build-skip diff,
  # scoped to this site's own base directory, is therefore correct as-is and
  # no `ignore` override is needed. See Bug0001/Bug0002 for why LeeAtchison
  # and AtchisonAcademy need one and this site does not.

[build.environment]
  NODE_ENV = "development"
  BRIDGETOWN_ENV = "production"

# The weekly-publish scheduled function (netlify/functions/weekly-publish.mts)
# hits a build hook every Tuesday so that week's article goes live just after
# the Kit send — see that file for the full mechanism and the Netlify-side
# setup (build hook + BUILD_HOOK_URL env var) it depends on. Scheduled
# functions only run on published (production) deploys, never on deploy
# previews or branch deploys.
[functions]
  directory = "netlify/functions"

# Deploy Previews build exactly like production, so that the preview is
# representative of what ships. These settings are identical to the [build]
# ones above, which previews already inherit; they are stated explicitly as
# the place to look when asking how previews differ here.
#
# The site URL itself is made preview aware in config/initializers.rb, not
# here — Bridgetown does not read the site URL from the environment, so
# setting URL or DEPLOY_PRIME_URL in this file would be inert. See Spec0004.
[context.deploy-preview]
  command = "bin/bridgetown deploy"

[context.deploy-preview.environment]
  NODE_ENV = "development"
  BRIDGETOWN_ENV = "production"

[build.processing.html]
  pretty_urls = true

[[headers]]
  for = "*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=15552000; includeSubDomains"
    Referrer-Policy = "no-referrer-when-downgrade"
    # Browsers re-check hourly; the CDN can hold a page longer because
    # Netlify purges its own cache on every deploy, so a new article or an
    # edit is live at the edge immediately either way. The browser half is
    # what a returning reader actually sees, and this site publishes weekly.
    Cache-Control = "public, max-age=3600, s-max-age=604800"

[[headers]]
  for = "/*.(png|jpg|js|css|svg|woff|woff2|ttf|eot|ico)"
  [headers.values]
    Cache-Control = "public, max-age=31536000, s-max-age=31536000"

# Every redirect below replaces a Kit-hosted URL on this domain (Spec0024
# Part 6 inventory, verified live 2026-09-03). 301, permanent, and force so a
# same-path Bridgetown page can never shadow one by accident during a build
# that briefly lacks it. `/posts/<slug>` needs no rule here: Kit serves it
# without a trailing slash, and Netlify's `pretty_urls` above already 301s
# the slashless form to Bridgetown's `/posts/<slug>/`.
[[redirects]]
  from = "/profile"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/profile/posts"
  to = "/posts/"
  status = 301
  force = true

[[redirects]]
  from = "/profile/about"
  to = "/about/"
  status = 301
  force = true

[[redirects]]
  from = "/profile/links"
  to = "/links/"
  status = 301
  force = true

# Kit Creator Network recommendations widget — no equivalent on this site.
# Decided 2026-09-03 (Open Question 11): send to the home page.
[[redirects]]
  from = "/profile/recommendations"
  to = "/"
  status = 301
  force = true

# The Ownership Gap Diagnostic's old short path (WEB-21, 2026-11-12). It
# used to forward to the Kit-hosted page; the diagnostic now has a real page
# on this site, /free/ownership-gap-diagnostic/. 301: the move is permanent.
# Netlify passes the incoming query string through, so old UTM-tagged links
# still report their source.
[[redirects]]
  from = "/service-ownership-diagnostic"
  to = "/free/ownership-gap-diagnostic/"
  status = 301
  force = true

[[redirects]]
  from = "/service-ownership-diagnostic/"
  to = "/free/ownership-gap-diagnostic/"
  status = 301
  force = true

# TEMPORARY (added 2026-09-03, Lee's request) — /architecting-with-ai/ had a
# real Bridgetown page here that embedded a dead Kit form (Open Question 14
# follow-on: its uid is a hosted landing page, not an embeddable one).
# Rather than ship a broken embed, Lee had the .erb source removed; the path
# is now served entirely by redirecting to Kit's still-working hosted
# version. 302/temporary, not 301, because this is not meant to be cached or
# to transfer SEO weight. REMOVE these rules if/when a real page is rebuilt
# here (src/_partials/_free_signup_form.erb can post to a hosted Kit form,
# as the /free/ pages do).
[[redirects]]
  from = "/architecting-with-ai"
  to = "https://softwarearchitectureinsights.kit.com/4cad4660e5"
  status = 302
  force = true

[[redirects]]
  from = "/architecting-with-ai/"
  to = "https://softwarearchitectureinsights.kit.com/4cad4660e5"
  status = 302
  force = true

# /webinar-architecting-systems-with-ai is another URL in the wild for the
# same webinar as /architecting-with-ai above — same Kit hosted landing page.
[[redirects]]
  from = "/webinar-architecting-systems-with-ai"
  to = "https://softwarearchitectureinsights.kit.com/4cad4660e5"
  status = 302
  force = true

[[redirects]]
  from = "/webinar-architecting-systems-with-ai/"
  to = "https://softwarearchitectureinsights.kit.com/4cad4660e5"
  status = 302
  force = true

# Podcast house-ad URLs (added 2026-10-06, Lee). A podcast ad can't carry a
# link, so each ad says a short URL here and these rules forward it with UTM
# tags. utm_content is the path, not the ad: several ads can share a path.
# Registry and rationale: "Podcast House Ad Redirects" in the UTM Standard
# (Dropbox: Professional/Social Media/UTM Standard.md); which ads use which
# path: SAI Podcast/Ads/Campaigns.md. 302, not 301, so a destination can
# change later without re-recording the ad and without browsers caching the
# old one. /join, not /subscribe: /subscribe is a real page on this site.

[[redirects]]
  from = "/scale"
  to = "https://architectingforscale.com/?utm_source=sai-podcast&utm_medium=podcast&utm_campaign=evergreen&utm_content=scale"
  status = 302
  force = true

[[redirects]]
  from = "/scale/"
  to = "https://architectingforscale.com/?utm_source=sai-podcast&utm_medium=podcast&utm_campaign=evergreen&utm_content=scale"
