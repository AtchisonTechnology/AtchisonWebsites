[dev]
  command = "bin/bridgetown dev"
  targetPort = 4000
  port = 8888
  publish = "output"
  autoLaunch = true
  framework = "#custom"

[context.dev.build.environment]
  NODE_ENV = "development"
  BRIDGETOWN_ENV = "development"

[build]
  command = "bin/bridgetown deploy"
  publish = "output"
  # Netlify's default build-skip check only diffs this site's own base
  # directory. src/_books and src/_courses are symlinks to shared/ (Spec0008),
  # so a change confined to shared/ never touches a path under this directory
  # and would otherwise be silently skipped (Bug0001). Widen the diff to also
  # cover shared/.
  #
  # Netlify runs this command from the site's base directory, not the repo
  # root, and git pathspecs are CWD-relative — plain "LeeAtchison shared"
  # matched nothing from here, so the diff was always empty and every
  # automatic build in every context skipped (Bug0002). The :(top) pathspec
  # magic anchors the paths to the repo root regardless of working directory,
  # which also makes local simulation behave identically to Netlify's
  # environment.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ':(top)LeeAtchison' ':(top)shared'"

[build.environment]
  NODE_ENV = "development"
  BRIDGETOWN_ENV = "production"

# Deploy Previews build exactly like production, so that the preview is
# representative of what ships. These settings are identical to the [build]
# ones above, which previews already inherit; they are stated explicitly as
# the place to look when asking how previews differ here.
#
# The site URL itself is made preview aware in config/initializers.rb, not
# here — Bridgetown does not read the site URL from the environment, so
# setting URL or DEPLOY_PRIME_URL in this file would be inert. Note also that
# [[headers]] and [[redirects]] are global in Netlify and cannot be scoped to
# a deploy context; only command, publish, and environment apply inside a
# context block. See Spec0004.
[context.deploy-preview]
  command = "bin/bridgetown deploy"

[context.deploy-preview.environment]
  NODE_ENV = "development"
  BRIDGETOWN_ENV = "production"

[build.processing.html]
  pretty_urls = true

[[headers]]
  for = "*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=15552000; includeSubDomains"
    Referrer-Policy = "no-referrer-when-downgrade"
    Cache-Control = "public, max-age=604800, s-max-age=604800"

[[headers]]
  for = "/*.(png|jpg|js|css|svg|woff|ttf|eot|ico|woff2)"
  [headers.values]
    Cache-Control = "public, max-age=31536000, s-max-age=31536000"

# /academy was the Atchison Academy landing page until the Academy became its
# own site at atchisonacademy.com (Spec0005, Spec0006). These are 301 —
# permanent, deliberately, and the opposite of the 302s Spec0002 used for the
# alias domain. That destination was going to change; this one is not, and a
# permanent redirect is what transfers the page's accumulated search ranking
# to the new domain instead of stranding it.
[[redirects]]
  from = "/academy"
  to = "https://atchisonacademy.com/"
  status = 301
  force = true

[[redirects]]
  from = "/academy/*"
  to = "https://atchisonacademy.com/"
  status = 301
  force = true

[[redirects]]
  from = "/ai-native"
  to = "/ainative/"
  status = 301
  force = true

[[redirects]]
  from = "/ai-native/*"
  to = "/ainative/"
  status = 301
  force = true
