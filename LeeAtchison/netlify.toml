[dev]
  command = "bin/bridgetown dev"
  targetPort = 4000
  port = 8888
  publish = "output"
  autoLaunch = true
  framework = "#custom"

[context.dev.build.environment]
  NODE_ENV = "development"
  BRIDGETOWN_ENV = "development"

[build]
  command = "bin/bridgetown deploy"
  publish = "output"

[build.environment]
  NODE_ENV = "development"
  BRIDGETOWN_ENV = "production"

# Deploy Previews build exactly like production, so that the preview is
# representative of what ships. These settings are identical to the [build]
# ones above, which previews already inherit; they are stated explicitly as
# the place to look when asking how previews differ here.
#
# The site URL itself is made preview aware in config/initializers.rb, not
# here — Bridgetown does not read the site URL from the environment, so
# setting URL or DEPLOY_PRIME_URL in this file would be inert. Note also that
# [[headers]] and [[redirects]] are global in Netlify and cannot be scoped to
# a deploy context; only command, publish, and environment apply inside a
# context block. See Spec0004.
[context.deploy-preview]
  command = "bin/bridgetown deploy"

[context.deploy-preview.environment]
  NODE_ENV = "development"
  BRIDGETOWN_ENV = "production"

[build.processing.html]
  pretty_urls = true

[[headers]]
  for = "*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=15552000; includeSubDomains"
    Referrer-Policy = "no-referrer-when-downgrade"
    Cache-Control = "public, max-age=604800, s-max-age=604800"

[[headers]]
  for = "/*.(png|jpg|js|css|svg|woff|ttf|eot|ico|woff2)"
  [headers.values]
    Cache-Control = "public, max-age=31536000, s-max-age=31536000"

# Domain redirects must come first — netlify.toml rules are evaluated in order,
# and these should win over any path rule below.
#
# atchisonacademy.com is an alias domain on this site. Without these rules it
# serves the whole leeatchison.com site under a second domain name (duplicate
# content). Send every path on it to the Academy page instead.
#
# These are 302 (temporary), deliberately. Atchison Academy is planned to
# become its own site at atchisonacademy.com. A 301 would be cached
# indefinitely by browsers and would deindex the domain in search, both of
# which would have to be undone by hand at cutover. Keep these temporary until
# the standalone site exists, at which point these rules are deleted, not
# changed. Netlify defaults to 301 when `status` is omitted, so the value must
# stay explicit.
[[redirects]]
  from = "https://atchisonacademy.com/*"
  to = "https://leeatchison.com/academy/"
  status = 302
  force = true

[[redirects]]
  from = "https://www.atchisonacademy.com/*"
  to = "https://leeatchison.com/academy/"
  status = 302
  force = true

[[redirects]]
  from = "/ai-native"
  to = "/ainative/"
  status = 301
  force = true

[[redirects]]
  from = "/ai-native/*"
  to = "/ainative/"
  status = 301
  force = true
