[dev]
  command = "bin/bridgetown dev"
  targetPort = 4000
  port = 8888
  publish = "output"
  autoLaunch = true
  framework = "#custom"

[context.dev.build.environment]
  NODE_ENV = "development"
  BRIDGETOWN_ENV = "development"

[build]
  command = "bin/bridgetown deploy"
  publish = "output"
  # Netlify's default build-skip check only diffs this site's own base
  # directory. src/_books and src/_courses are symlinks to shared/ (Spec0008),
  # so a change confined to shared/ never touches a path under this directory
  # and would otherwise be silently skipped (Bug0001). Widen the diff to also
  # cover shared/.
  #
  # $CACHED_COMMIT_REF is empty on a branch/context with no prior successful
  # deploy (e.g. a brand-new PR). Unquoted and empty, it drops out of the
  # command entirely, collapsing `git diff --quiet $CACHED_COMMIT_REF
  # $COMMIT_REF -- paths` to a single-ref `git diff --quiet $COMMIT_REF --
  # paths` — a working-tree-vs-itself diff that is always empty, so the build
  # skips regardless of actual content. Fall back to git's empty-tree object
  # so a first build always has real content to compare against and builds.
  ignore = "git diff --quiet ${CACHED_COMMIT_REF:-4b825dc642cb6eb9a060e54bf8d69288fbee4904} $COMMIT_REF -- AtchisonAcademy shared"

[build.environment]
  NODE_ENV = "development"
  BRIDGETOWN_ENV = "production"

# Deploy Previews build exactly like production, so that the preview is
# representative of what ships. These settings are identical to the [build]
# ones above, which previews already inherit; they are stated explicitly as
# the place to look when asking how previews differ here.
#
# The site URL itself is made preview aware in config/initializers.rb, not
# here — Bridgetown does not read the site URL from the environment, so
# setting URL or DEPLOY_PRIME_URL in this file would be inert. Note also that
# [[headers]] and [[redirects]] are global in Netlify and cannot be scoped to
# a deploy context; only command, publish, and environment apply inside a
# context block. See Spec0004.
[context.deploy-preview]
  command = "bin/bridgetown deploy"

[context.deploy-preview.environment]
  NODE_ENV = "development"
  BRIDGETOWN_ENV = "production"

[build.processing.html]
  pretty_urls = true

[[headers]]
  for = "*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=15552000; includeSubDomains"
    Referrer-Policy = "no-referrer-when-downgrade"
    Cache-Control = "public, max-age=604800, s-max-age=604800"

[[headers]]
  for = "/*.(png|jpg|js|css|svg|woff|ttf|eot|ico|woff2)"
  [headers.values]
    Cache-Control = "public, max-age=31536000, s-max-age=31536000"
