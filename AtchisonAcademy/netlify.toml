[dev]
  command = "bin/bridgetown dev"
  targetPort = 4000
  port = 8888
  publish = "output"
  autoLaunch = true
  framework = "#custom"

[context.dev.build.environment]
  NODE_ENV = "development"
  BRIDGETOWN_ENV = "development"

[build]
  command = "bin/bridgetown deploy"
  publish = "output"
  # Netlify's default build-skip check only diffs this site's own base
  # directory. src/_books and src/_courses are symlinks to shared/ (Spec0008),
  # so a change confined to shared/ never touches a path under this directory
  # and would otherwise be silently skipped (Bug0001). Widen the diff to also
  # cover shared/.
  #
  # Netlify runs this command from the site's base directory, not the repo
  # root, and git pathspecs are CWD-relative — plain "AtchisonAcademy shared"
  # matched nothing from here, so the diff was always empty and every
  # automatic build in every context skipped (Bug0002). The :(top) pathspec
  # magic anchors the paths to the repo root regardless of working directory,
  # which also makes local simulation behave identically to Netlify's
  # environment.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ':(top)AtchisonAcademy' ':(top)shared'"

[build.environment]
  NODE_ENV = "development"
  BRIDGETOWN_ENV = "production"

# Deploy Previews build exactly like production, so that the preview is
# representative of what ships. These settings are identical to the [build]
# ones above, which previews already inherit; they are stated explicitly as
# the place to look when asking how previews differ here.
#
# The site URL itself is made preview aware in config/initializers.rb, not
# here — Bridgetown does not read the site URL from the environment, so
# setting URL or DEPLOY_PRIME_URL in this file would be inert. Note also that
# [[headers]] and [[redirects]] are global in Netlify and cannot be scoped to
# a deploy context; only command, publish, and environment apply inside a
# context block. See Spec0004.
[context.deploy-preview]
  command = "bin/bridgetown deploy"

[context.deploy-preview.environment]
  NODE_ENV = "development"
  BRIDGETOWN_ENV = "production"

# Permanent short links. Each is spoken or printed somewhere that can't be
# edited, so neither side of a rule may ever change. 302, not 301, so the
# destination can move without browsers having cached the old one. A rule
# here is independent of the build, so a template bug can't break it.
#
# /cost-webinar: spoken in the recorded "When the Cloud Savings Stop"
# webinar and shown on its last slide (Spec0031 §B5). Netlify matches it with
# or without a trailing slash.
[[redirects]]
  from = "/cost-webinar"
  to = "/webinars/architecting-for-cost/"
  status = 302

[build.processing.html]
  pretty_urls = true

# Browser caching (WEB-28). Netlify applies every rule whose path matches,
# and where two set the same header the later rule wins, so the "*" rule
# sets the page default first and the asset rules after it override it.
#
# Pages must never get a long browser cache. A browser that keeps a page
# reuses it without asking Netlify, so a changed price, course page or form
# can take days to reach a returning visitor: a browser's saved copy of
# /share-a-quote/ kept posting the old form without its hidden `subject`
# field (WEB-25). `max-age=0, must-revalidate` is Netlify's own default for
# HTML: the browser keeps its copy but checks it on every visit, and Netlify
# answers 304 when nothing changed, which costs almost nothing.
[[headers]]
  for = "*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=15552000; includeSubDomains"
    Referrer-Policy = "no-referrer-when-downgrade"
    Cache-Control = "public, max-age=0, must-revalidate"

# esbuild's CSS and JS output. Each file name carries a content hash
# (index.ZIN7W652.css), so a changed file is a new URL and the old copy can
# be cached for a year without going stale.
[[headers]]
  for = "/_bridgetown/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Files whose name stays the same when we replace them: images (including
# the shared book and course covers), downloads and the favicon. One hour,
# so a replaced file reaches everyone the same day.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=3600"
