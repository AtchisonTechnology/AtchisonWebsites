# the Dropbox file is marked superseded (the same rule Spec0025 used).
#
# Text fields go through the `sales_text` helper (plugins/builders/offers.rb):
# HTML is escaped, then *italic*, **bold**, and {contact} — a link to
# contact_url labelled contact_label, standing in for the copy file's
# [contact] — are expanded. Nothing else is interpreted.

