[dev]
  command = "bin/bridgetown dev"
  targetPort = 4000
  port = 8888
  publish = "output"
  autoLaunch = true
  framework = "#custom"

[context.dev.build.environment]
  NODE_ENV = "development"
  BRIDGETOWN_ENV = "development"

[build]
  command = "bin/bridgetown deploy"
  publish = "output"

[build.environment]
  NODE_ENV = "development"
  BRIDGETOWN_ENV = "production"

# Deploy Previews build exactly like production, so that the preview is
# representative of what ships. These settings are identical to the [build]
# ones above, which previews already inherit; they are stated explicitly as
# the place to look when asking how previews differ here.
#
# The site URL itself is made preview aware in config/initializers.rb, not
# here — Bridgetown does not read the site URL from the environment, so
# setting URL or DEPLOY_PRIME_URL in this file would be inert. Note also that
# [[headers]] and [[redirects]] are global in Netlify and cannot be scoped to
# a deploy context; only command, publish, and environment apply inside a
# context block. See Spec0004.
[context.deploy-preview]
  command = "bin/bridgetown deploy"

[context.deploy-preview.environment]
  NODE_ENV = "development"
  BRIDGETOWN_ENV = "production"

[build.processing.html]
  pretty_urls = true

# Browser caching (WEB-29, same as atchisonacademy.com in WEB-28). Netlify
# applies every rule whose path matches, and where two set the same header
# the later rule wins, so the "*" rule sets the page default first and the
# asset rules after it override it.
#
# Pages must never get a long browser cache. A browser that keeps a page
# reuses it without asking Netlify, so a changed page or form can take days
# to reach a returning visitor; that is how a saved copy of atchisonacademy.com's
# quote form kept posting an old version (WEB-25). `max-age=0, must-revalidate`
# is Netlify's own default for HTML: the browser keeps its copy but checks it
# on every visit, and Netlify answers 304 when nothing changed.
[[headers]]
  for = "*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=15552000; includeSubDomains"
    Referrer-Policy = "no-referrer-when-downgrade"
    Cache-Control = "public, max-age=0, must-revalidate"

# esbuild's CSS and JS output (and anything it bundles, such as fonts). Each
# file name carries a content hash (index.S3N7ETO4.css), so a changed file is
# a new URL and the old copy can be cached for a year without going stale.
[[headers]]
  for = "/_bridgetown/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Files whose name stays the same when we replace them: images, downloads
# and the favicon and app icons. One hour, so a replaced file reaches
# everyone the same day.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=3600"
